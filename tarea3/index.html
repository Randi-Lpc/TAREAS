<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ingreso de Clientes</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="contenedor">
        <h1>Registro de Clientes</h1>

        <form>

            <label for="cedula">Cédula</label>
            <input type="text" id="cedula" placeholder="Ingrese la cédula">

            <label for="nombre">Nombre</label>
            <input type="text" id="nombre" placeholder="Ingrese el nombre">

            <label for="direccion">Dirección</label>
            <input type="text" id="direccion" placeholder="Ingrese la dirección">

            <label for="telefono">Teléfono</label>
            <input type="text" id="telefono" placeholder="Ingrese el teléfono">

            <label for="correo">Correo Electrónico</label>
            <input type="email" id="correo" placeholder="Ingrese el correo">

            <button type="submit">Guardar</button>

        </form>
    </div>

</body>
</html>
