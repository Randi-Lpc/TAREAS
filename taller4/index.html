<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis Tareas</title>
    <link rel="stylesheet" href="estilos.css">
</head>
<body>
    <div class="caja">
        <h1>Mis tareas</h1>
        
        <form id="formulario-tareas">
            <input type="text" id="titulo-tarea" placeholder="Título" required>
            <textarea id="descripcion-tarea" placeholder="Descripción" rows="3" required></textarea>
            <button type="submit">Guardar tarea</button>
        </form>
        
        <div class="botones">
            <button id="btn-exportar-json" class="secundario">Exportar JSON</button>
            <button id="btn-exportar-xml" class="secundario">Exportar XML</button>
        </div>
        
        <h2>Tareas guardadas</h2>
        <ul id="lista-tareas"></ul>
    </div>
    
    <script src="aplicacion.js"></script>
</body>
</html>
